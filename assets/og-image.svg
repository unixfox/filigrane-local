        <text x="580" y="450" fill="#404040">DOCUMENT EXCLUSIVEMENT DESTINÉ À LA LOCATION   DOCUMENT EXCLUSIVEMENT</text>
      </g>
      <g opacity=".6">
        <text x="640" y="150" fill="#404040">DOCUMENT EXCLUSIVEMENT DESTINÉ À LA LOCATION   DOCUMENT EXCLUSIVEMENT</text>
        <text x="600" y="250" fill="#00005b">DOCUMENT EXCLUSIVEMENT DESTINÉ À LA LOCATION   DOCUMENT EXCLUSIVEMENT</text>
        <text x="620" y="350" fill="#ff0000" opacity=".8">DOCUMENT EXCLUSIVEMENT DESTINÉ À LA LOCATION   DOCUMENT EXCLUSIVEMENT</text>
        <text x="580" y="450" fill="#404040">DOCUMENT EXCLUSIVEMENT DESTINÉ À LA LOCATION   DOCUMENT EXCLUSIVEMENT</text>
