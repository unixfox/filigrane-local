    <text x="211" y="484" text-anchor="middle" fill="#18753c">🔒 100 % navigateur</text>
    <rect x="358" y="450" width="268" height="52" rx="26" fill="#e3e8fc"/>
    <text x="492" y="484" text-anchor="middle" fill="#2238a8">PDF · JPG · PNG · HEIC</text>
  </g>
  <text x="80" y="566" font-size="22" fill="#5c5c66">Aucun fichier envoyé · No upload · Open source</text>

  <!-- Watermarked sheet illustration -->
  <g filter="url(#shadow)"><rect x="790" y="70" width="330" height="467" rx="10" fill="#fff"/></g>
  <g fill="#d9dce6">
    <rect x="830" y="118" width="150" height="16" rx="4" fill="#b9bfd3"/>
    <rect x="830" y="166" width="250" height="10" rx="5"/>
    <rect x="830" y="192" width="230" height="10" rx="5"/>
    <rect x="830" y="218" width="250" height="10" rx="5"/>
    <rect x="830" y="244" width="190" height="10" rx="5"/>
    <rect x="830" y="290" width="250" height="10" rx="5"/>
    <rect x="830" y="316" width="240" height="10" rx="5"/>
    <rect x="830" y="342" width="250" height="10" rx="5"/>
    <rect x="830" y="368" width="160" height="10" rx="5"/>
    <rect x="830" y="414" width="250" height="10" rx="5"/>
    <rect x="830" y="440" width="210" height="10" rx="5"/>
    <rect x="980" y="478" width="100" height="22" rx="4" fill="#c9cede"/>
