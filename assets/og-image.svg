<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Noto Sans, DejaVu Sans, sans-serif">
  <defs>
    <clipPath id="sheet"><rect x="790" y="70" width="330" height="467" rx="10"/></clipPath>
    <clipPath id="lp"><path d="M17 10h21l11 11v33a2 2 0 0 1-2 2H17a2 2 0 0 1-2-2V12a2 2 0 0 1 2-2Z"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1b2a7a" flood-opacity=".22"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="1200" height="630" fill="#f4f6fd"/>
  <rect width="1200" height="10" fill="#2f4bd8"/>

  <!-- Logo -->
  <g transform="translate(80 92) scale(1.5)">
    <rect width="64" height="64" rx="14" fill="#2f4bd8"/>
    <path d="M17 10h21l11 11v33a2 2 0 0 1-2 2H17a2 2 0 0 1-2-2V12a2 2 0 0 1 2-2Z" fill="#fff"/>
    <g clip-path="url(#lp)" stroke-linecap="round">
      <path d="M8 38 56 16" stroke="#2f4bd8" stroke-width="4.5" opacity=".55"/>
      <path d="M8 50 56 28" stroke="#e8343b" stroke-width="4.5" opacity=".55"/>
      <path d="M8 62 56 40" stroke="#2f4bd8" stroke-width="4.5" opacity=".3"/>
    </g>
    <path d="M38 10v9a2 2 0 0 0 2 2h9Z" fill="#c9d2f7"/>
  </g>
  <text x="194" y="157" font-size="46" fill="#1e1e1e">Filigrane<tspan font-weight="700">Local</tspan></text>

  <!-- Headline -->
  <text x="80" y="275" font-size="54" font-weight="700" fill="#1e1e1e">Ajoutez un filigrane</text>
  <text x="80" y="342" font-size="54" font-weight="700" fill="#1e1e1e">à vos documents</text>
  <text x="80" y="398" font-size="28" fill="#5c5c66">Add a watermark to your documents</text>

  <!-- Badges -->
  <g font-size="24" font-weight="600">
